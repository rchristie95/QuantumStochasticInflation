function load(n, reverse = false) {

  index = n;
  document.getElementById('error').style.display = 'none';
  video.src = slides[index][reverse ? 'rev_file' : 'file'];

  if (video.paused && !video.ended && video.currentTime > 0) video.play().catch(() => {});

  switch (event.key.toLowerCase()) {
    case 'arrowright': case 'pagedown': next(); break;
    case 'arrowleft': case 'pageup': load(index - 1); break;
